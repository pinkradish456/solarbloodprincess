      <script>
          const formulaire = document.getElementById('formulaire-recherche');
const champSaisie = document.getElementById('rechercheLiens');

formulaire.addEventListener('submit', (event) => {
  // 1. Empêcher le rechargement automatique de la page
  event.preventDefault(); 

  const texteSaisi = champSaisie.value.trim();
  const urlActuelle = new URL(window.location.href);

  if (texteSaisi !== "") {
    urlActuelle.searchParams.set('search', texteSaisi);
  } else {
    urlActuelle.searchParams.delete('search');
  }

  // 2. Ajouter une NOUVELLE étape dans l'historique (pushState) 
  // L'utilisateur pourra ainsi utiliser le bouton "Retour" du navigateur
  window.history.pushState({}, '', urlActuelle.toString());
